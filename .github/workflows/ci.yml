name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install the package
        run: pip install -e ".[train,scrape,scan,dev]"
      - name: Lint
        run: ruff check .
      - name: Run tests
        run: pytest
      - name: Check shell script syntax
        run: |
          for script in scripts/*.sh; do
            bash -n "$script"
          done
      - name: Check that the notebooks are valid JSON
        run: |
          for notebook in notebooks/*.ipynb; do
            python -m json.tool "$notebook" > /dev/null
          done
