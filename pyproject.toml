[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "card-grading"
version = "0.1.0"
description = "Automated grading of baseball trading cards using convolutional neural networks"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Brian Miller", email = "brian.s.miller@du.edu" },
    { name = "Sean Wendlandt", email = "sean.wendlandt@du.edu" },
]
dependencies = [
    "numpy>=1.26",
    "pillow>=10.0",
]

[project.optional-dependencies]
train = ["tensorflow>=2.16"]
scrape = ["requests>=2.31", "beautifulsoup4>=4.12", "pandas>=2.0"]
scan = ["opencv-python-headless>=4.8"]
notebooks = ["pandas>=2.0", "matplotlib>=3.8", "seaborn>=0.13", "jupyter"]
dev = ["pytest>=8.0", "ruff>=0.6"]
all = ["card-grading[train,scrape,scan,notebooks,dev]"]

[project.scripts]
card-grading-scrape = "card_grading.scraping:main"
card-grading-fetch-psa = "card_grading.psa_api:main"
card-grading-crop = "card_grading.cropping:main"
card-grading-flip = "card_grading.augmentation:main"
card-grading-train = "card_grading.training:main"
card-grading-split-scan = "card_grading.scans:main"
card-grading-assess = "card_grading.assess:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    # deprecation notices raised inside TensorFlow and its dependencies, not by this package
    "ignore::DeprecationWarning:gast.*",
    "ignore::DeprecationWarning:keras.*",
    "ignore::DeprecationWarning:tensorflow.*",
]

[tool.ruff]
line-length = 120
src = ["src", "tests"]
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
